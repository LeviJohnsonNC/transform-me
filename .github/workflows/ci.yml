name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile and package.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Not blocking yet: main carries 6 pre-existing ESLint errors, in
      # components/ui, a generated Supabase file, and the Tailwind config. The
      # step reports them so they stay visible. Once they are cleared, drop the
      # continue-on-error line and lint becomes a real gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true
