name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile and package.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Blocking, as of the Tier 4 cleanup: the 6 pre-existing errors are gone.
      # Warnings still pass — the two `exhaustive-deps` ones in Today.tsx belong
      # to the reward-cycle hardening the roadmap deliberately deferred, and
      # failing on them would mean either doing that work now or suppressing it.
      - name: Lint
        run: npm run lint
